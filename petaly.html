        <svg viewBox="0 0 3005 2584" class="threads-diagram" role="img" aria-labelledby="threadsTitle"><title id="threadsTitle">三つの糸 — Petalyが編み込むもの</title><g transform="matrix(4.166667,0,0,4.166667,1462.5,216.666667)"><text x="-201.525px" y="0px" style="font-family:'HiraginoSans-W7', 'Hiragino Sans', sans-serif;font-weight:700;font-size:26px;fill:#1c1c1e;">三つの糸</text><text x="-90.302px" y="0px" style="font-family:'Helvetica-Bold', 'Helvetica';font-weight:700;font-size:26px;fill:#1c1c1e;">— Petaly</text><text x="19.525px" y="0px" style="font-family:'HiraginoSans-W7', 'Hiragino Sans', sans-serif;font-weight:700;font-size:26px;fill:#1c1c1e;">が編み込むもの</text></g><text x="365.625px" y="333.333px" style="font-family:'HiraginoSans-W4', 'Hiragino Sans', sans-serif;font-size:56.25px;fill:#1c1c1e;fill-opacity:0.6;">大学と学生、学生と社会、そして危機の場面。三本の糸を一つのプラットフォームに。</text><g opacity="0.6"><circle cx="262.5" cy="1466.667" r="208.333" style="fill:none;stroke:#c7c7c9;stroke-width:8.33px;stroke-dasharray:20.833,20.833;"/><text x="212.5px" y="1445.833px" style="font-family:'HiraginoSans-W4', 'Hiragino Sans', sans-serif;font-size:50px;fill:#1c1c1e;fill-opacity:0.6;">孤立</text><text x="116.667px" y="1516.667px" style="font-family:'HiraginoSans-W4', 'Hiragino Sans', sans-serif;font-size:41.667px;fill:#1c1c1e;fill-opacity:0.4;">つながりの不在</text></g><path d="M479.167,1466.667l725,0" style="fill:none;fill-rule:nonzero;stroke:#d8d8da;stroke-width:7.3px;stroke-dasharray:14.599,14.599;"/><circle cx="1462.5" cy="1466.667" r="258.333" style="fill:#fff;stroke:#3b6fd6;stroke-width:10.42px;"/><text x="1362.5px" y="1433.333px" style="font-family:'HiraginoSans-W7', 'Hiragino Sans', sans-serif;font-weight:700;font-size:66.667px;fill:#1c1c1e;">留学生</text><text x="1395.913px" y="1520.833px" style="font-family:'Helvetica';font-size:47.917px;fill:#1c1c1e;fill-opacity:0.6;">Petaly</text><path d="M1462.5,1208.333l0,-450" style="fill:none;fill-rule:nonzero;stroke:#2e5fa3;stroke-width:16.67px;stroke-linecap:round;"/><circl
